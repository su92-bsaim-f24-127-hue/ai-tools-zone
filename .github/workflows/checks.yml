name: CI Checks

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
      - name: Run build, tests and audits
        run: |
          python build_site.py
          python test_seo_build.py
          python audit_seo.py
          python audit_growth.py
          python test_growth.py
